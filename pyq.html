<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7566d8">
<link rel="stylesheet" href="style.css">
</head>
<body class="feature-standalone">
<div class="feature-shell">
  <nav class="feature-nav">
    <div class="nav-links">
      <a class="feature-back" href="menu.html">← Menu</a>
      <a class="feature-home" href="tracker.html">⌂ Tracker</a>
    </div>
    <a class="feature-back" href="index.html">Home</a>
  </nav>
  <main class="feature-page-card">
    <h1 class="feature-page-title">☑️ PYQ Question Tracker</h1>
    <p class="feature-page-sub">Track PYQs in 10-question blocks and revision ticks.</p>
    
        <div class="pyq-toolbar">
          
          <div class="pyq-actions">
            <button class="secondary" id="pyqClearBtn" type="button">Clear PYQ Tracker</button>
            <button class="primary" id="pyqPdfBtn" type="button">📄 Download A4 PDF</button>
          </div>
        </div>

        <div class="pyq-form card">
          <div class="small"><label>Subject</label>
            <select id="pyqSubject"><option>Physics</option><option>Chemistry</option><option>Mathematics</option></select>
          </div>
          <div class="pyq-chapter-field"><label>Chapter Name</label>
            <input id="pyqChapterName" type="text" maxlength="100" placeholder="e.g. Motion in Straight Line">
          </div>
          <div class="small"><label>Total PYQs</label>
            <input id="pyqTotalQuestions" type="number" min="1" max="1000" step="1" placeholder="50">
          </div>
          <button class="primary" id="pyqAddBtn" type="button">+ Add Chapter</button>
        </div>

        <div class="pyq-help">
          <b>1 small square = 10 questions.</b>
          Example: 50 PYQs → 5 blocks. The last block shows the actual question number.
          <span>REV boxes are for manual revision ticks.</span>
        </div>

        <div id="pyqList" class="pyq-list"></div>
      
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="script.js"></script>
</body>
</html>
