<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — EXAMYWEB</title><link rel="stylesheet" href="style.css"></head>
<body class="auth mono">
<div class="auth-shell">
  <a class="brand auth-brand" href="index.html"><span class="logo">E</span><span>EXAMY<span>WEB</span></span></a>
  <div class="auth-card">
    <div class="eyebrow">WELCOME BACK</div><h1>Log in to<br>your tracker.</h1><p class="auth-copy">Continue your study streak and keep your preparation on track.</p>
    <form id="loginForm">
      <label>Email<input type="email" placeholder="you@example.com" required></label>
      <label>Password<input type="password" placeholder="••••••••" required></label>
      <div class="form-row"><label class="check"><input type="checkbox"> Remember me</label><a href="#" onclick="return false">Forgot password?</a></div>
      <button class="btn primary full" type="submit">Log in <span>→</span></button>
    </form>
    <div class="divider"><span>OR</span></div>
    <a class="btn secondary full" href="signup.html">Create free account</a>
    <p class="switch">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
  <small class="auth-foot">Free forever · No payment required</small>
</div>
<script src="script.js"></script></body></html>
