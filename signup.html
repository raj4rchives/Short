<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up — EXAMYWEB</title><link rel="stylesheet" href="style.css"></head>
<body class="auth mono">
<div class="auth-shell">
  <a class="brand auth-brand" href="index.html"><span class="logo">E</span><span>EXAMY<span>WEB</span></span></a>
  <div class="auth-card">
    <div class="eyebrow">START TODAY</div><h1>Create your<br>study account.</h1><p class="auth-copy">Set up your free EXAMYWEB tracker in less than a minute.</p>
    <form id="signupForm">
      <label>Full name<input type="text" placeholder="Raj Sharma" required></label>
      <label>Email<input type="email" placeholder="you@example.com" required></label>
      <label>Exam<select required><option value="">Choose your exam</option><option>JEE Main</option><option>JEE Advanced</option><option>NEET</option><option>Boards</option><option>CUET</option><option>Other</option></select></label>
      <label>Password<input type="password" minlength="6" placeholder="Minimum 6 characters" required></label>
      <label class="check terms"><input type="checkbox" required> I agree to use EXAMYWEB for study tracking.</label>
      <button class="btn primary full" type="submit">Create account <span>→</span></button>
    </form>
    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
  <small class="auth-foot">100% free · No payment page · No subscription</small>
</div>
<script src="script.js"></script></body></html>
